# GHAS External Access Extension
# This is a configuration-only extension for external GHAS MCP access

id = "ghas-external-access"
name = "GHAS External Access"
description = "Provides external access configuration for GHAS MCP server"
version = "0.1.0"
schema_version = 1
authors = ["toxicwind <toxicwind@users.noreply.github.com>"]
repository = "https://github.com/toxicwind/zed"

# This extension provides configuration only, no language servers or grammars
# The actual MCP server is managed externally via ghas-mcp-stdio.sh

[[capabilities]]
kind = "context_server"
id = "ghas-external"
name = "GHAS External Access"
description = "External access to GHAS MCP server"

[[capabilities]]
kind = "context_server"
id = "ghas-tailscale"
name = "GHAS Tailscale Access"
description = "Secure GHAS access via Tailscale"

[[capabilities]]
kind = "context_server"
id = "ghas-local"
name = "GHAS Local Access"
description = "Local development access to GHAS MCP"